<svg width="674" height="670" viewBox="0 0 674 670" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgv" cx="46%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#232419"/>
      <stop offset="55%" stop-color="#181910"/>
      <stop offset="100%" stop-color="#0E0F09"/>
    </radialGradient>
    <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F4E1A6"/>
      <stop offset="50%" stop-color="#D8B15C"/>
      <stop offset="100%" stop-color="#9C7A32"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="674" height="670" rx="130" ry="130"/>
    </clipPath>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="glass" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF6DE" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFF6DE" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFF6DE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handleShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBEFC9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FBEFC9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="674" height="670" fill="url(#bgv)"/>
  </g>

  <!-- outer faint dotted ring -->
  <circle cx="337" cy="335" r="216" fill="none" stroke="#8A7A46" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="1 9" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <!-- main ring becomes the lens of a magnifying glass -->
    <circle cx="337" cy="335" r="192" fill="url(#glass)"/>
    <circle cx="337" cy="335" r="192" fill="none" stroke="url(#gold)" stroke-opacity="0.95" stroke-width="7"/>
    <!-- glass highlight arc -->
    <path d="M215 220 A192 192 0 0 1 300 152" fill="none" stroke="#FFF6DE" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>

    <!-- handle: tapered with a soft shine stripe -->
    <path d="M478 452 L586 560 C592 566 592 576 585 582 C579 588 570 588 564 582 L456 474 Z"
          fill="url(#gold)"/>
    <path d="M470 460 L560 550" stroke="url(#handleShine)" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="337" cy="335" r="192" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1" transform="translate(0,2)"/>

    <!-- dotted connector -->
    <path d="M347 292 C372 278 390 268 405 256" fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-dasharray="1 9" stroke-linecap="round"/>

    <!-- gift box (outline) with GT monogram -->
    <g transform="translate(310,335)">
      <rect x="-48" y="-26" width="96" height="72" rx="4" fill="none" stroke="url(#gold)" stroke-width="6"/>
      <path d="M-24 -26 C-24 -42 -10 -50 0 -36 C10 -50 24 -42 24 -26"
            fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="-36" r="3.4" fill="url(#gold)"/>
      <text x="0" y="24" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="700" font-size="30" fill="url(#gold)">G<tspan font-family="Newsreader, Georgia, serif" font-style="italic" font-weight="500">T</tspan></text>
    </g>

    <!-- map pin (outline with filled core) -->
    <g transform="translate(438,197)">
      <path d="M0 -58
               C29 -58 52 -36 52 -8
               C52 26 12 68 0 82
               C-12 68 -52 26 -52 -8
               C-52 -36 -29 -58 0 -58 Z"
            fill="none" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-30 -40 C-22 -50 -10 -55 2 -54" fill="none" stroke="#FFF6DE" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-8" r="12" fill="url(#gold)"/>
      <circle cx="-3" cy="-11" r="3.4" fill="#FFF6DE" opacity="0.55"/>
    </g>
  </g>
</svg>
